name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      # The Telco CSV is not in the repository (licence not verified): tests that need it, or
      # the committed demo model, are skipped with an explicit reason. Everything else runs on
      # small synthetic data defined in tests/conftest.py.
      - name: Tests
        run: pytest -o addopts="" -q -rs

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t churnguard-api .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 churnguard-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break || sleep 2; done
          curl -fs http://localhost:8000/health | grep '"model_loaded":true'
          docker rm -f api
